# =====================================================================
# Profile "reset" - NAP LAI DU LIEU MAU TU DAU
# =====================================================================
# Cach dung:
#     .\mvnw spring-boot:run "-Dspring-boot.run.profiles=reset"
#
# CANH BAO: profile nay bat lai spring.sql.init.mode=always, khien
# schema.sql chay lai. Ma schema.sql mo dau bang DROP TABLE IF EXISTS
# nen TOAN BO DU LIEU DANG CO SE BI XOA, ke ca du lieu nhap qua giao dien.
# Chi dung khi co chu dinh dua CSDL ve dung bo du lieu mau ban dau.
#
# Chay binh thuong (khong kem profile) thi mode=never, du lieu duoc giu nguyen.
# =====================================================================
spring:
  sql:
    init:
      mode: always

  # ---------------------------------------------------------------
  # TAT DEVTOOLS TRONG PROFILE NAY - day la mot cai bay that su.
  #
  # DevTools tu khoi dong lai ung dung moi khi thay file trong target/
  # doi. Chay ".\mvnw test" trong luc app dang chay se bien dich lai va
  # kich hoat dung dieu do. Ma o profile reset thi moi lan khoi dong lai
  # la schema.sql chay lai, tuc DROP TABLE - XOA SACH du lieu vua sinh.
  #
  # Phat hien o muc 4A va da phai dung app thu cong truoc khi chay test.
  # Tat han o day thay vi de nguoi dung phai NHO lam dieu do moi lan.
  # ---------------------------------------------------------------
  devtools:
    restart:
      enabled: false
