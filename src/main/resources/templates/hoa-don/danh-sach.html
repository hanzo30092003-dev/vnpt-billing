<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Hóa đơn', ~{::noiDungTrang})}">
<body>

<div th:fragment="noiDungTrang">

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div th:replace="~{fragments/trang :: tieuDe(
                'bi-receipt', 'Danh sách hóa đơn',
                'Xem tiền cước từng tháng của khách hàng, in hóa đơn và ghi nhận khi khách trả tiền.')}"></div>
        <div th:replace="~{fragments/trang :: nutExcel('/hoa-don/xuat-excel?' + ${chuoiLoc})}"></div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form method="get" th:action="@{/hoa-don}" th:object="${boLoc}" class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small mb-1">Kỳ cước</label>
                    <select class="form-select" th:field="*{kyCuocId}">
                        <option value="">Tất cả</option>
                        <option th:each="k : ${danhSachKy}" th:value="${k.id}"
                                th:text="${k.thang} + '/' + ${k.nam}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">Trạng thái</label>
                    <select class="form-select" th:field="*{trangThai}">
                        <option value="">Tất cả</option>
                        <option th:each="t : ${danhSachTrangThai}" th:value="${t}" th:text="${t.nhan}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">Khách hàng</label>
                    <input type="text" class="form-control" th:field="*{khachHang}" placeholder="Tên hoặc mã KH">
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">Số thuê bao</label>
                    <input type="text" class="form-control" th:field="*{soThueBao}" placeholder="09xxxxxxxx">
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">Số tiền từ</label>
                    <input type="number" step="1000" class="form-control" th:field="*{tuSoTien}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">Đến</label>
                    <input type="number" step="1000" class="form-control" th:field="*{denSoTien}">
                </div>
                <div th:replace="~{fragments/trang :: nutLoc('/hoa-don', 'col-12 mt-2')}"></div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex align-items-center">
            <strong th:text="${tongHop.soHoaDon} + ' hóa đơn'">0 hóa đơn</strong>
            <span class="text-secondary ms-2" th:if="${ketQua.totalPages > 1}">
                &mdash; trang <span th:text="${ketQua.number + 1}">1</span>/<span th:text="${ketQua.totalPages}">1</span>
            </span>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm bang-du-lieu mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Mã hóa đơn</th>
                        <th>Kỳ</th>
                        <th>Khách hàng</th>
                        <th>Số thuê bao</th>
                        <th>Hạn thanh toán</th>
                        <th class="text-end">Tổng thanh toán</th>
                        <th class="text-end">Đã thu</th>
                        <th class="text-end">Còn nợ</th>
                        <th>Trạng thái</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${ketQua.isEmpty()}">
                        <td colspan="10">
                            <div th:replace="~{fragments/trang :: bangRong(
                                    'bi-receipt',
                                    'Không có hóa đơn nào khớp bộ lọc đang đặt. Hãy nới bộ lọc, hoặc kiểm tra xem tháng đã chọn đã lập hóa đơn chưa.',
                                    'Xoá bộ lọc', @{/hoa-don})}"></div>
                        </td>
                    </tr>
                    <tr th:each="h : ${ketQua.content}">
                        <td><a th:href="@{/hoa-don/{id}(id=${h.id})}" th:text="${h.maHoaDon}"></a></td>
                        <td th:text="${h.kyCuoc.thang} + '/' + ${h.kyCuoc.nam}"></td>
                        <td th:text="${h.khachHang.tenKh}"></td>
                        <td th:text="${h.thueBao.soThueBao}"></td>
                        <td th:text="${#temporals.format(h.hanThanhToan, 'dd/MM/yyyy')}"></td>
                        <td class="text-end fw-semibold"
                            th:text="${#numbers.formatDecimal(h.tongThanhToan, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(h.daThanhToan, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td class="text-end"
                            th:classappend="${h.conNo.signum() > 0} ? 'text-danger fw-semibold' : ''"
                            th:text="${#numbers.formatDecimal(h.conNo, 0, 'POINT', 0, 'COMMA')}"></td>
                        <!--/* Mau badge lay tu enum, khong dat dieu kien trong template - bon
                               man hinh dung chung mot quy tac mau */-->
                        <td>
                            <span class="badge" th:classappend="${h.trangThai.lopBadge}"
                                  th:text="${h.trangThai.nhan}"></span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/hoa-don/{id}(id=${h.id})}">Xem</a>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot class="table-light fw-semibold" th:if="${tongHop.soHoaDon > 0}">
                    <tr>
                        <td colspan="5" class="text-end">TỔNG THEO BỘ LỌC</td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(tongHop.tongPhatSinh, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(tongHop.tongDaThu, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td class="text-end text-danger"
                            th:text="${#numbers.formatDecimal(tongHop.tongConNo, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td colspan="2"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>

            <div th:replace="~{fragments/trang :: phanTrang(${ketQua}, '/hoa-don', ${chuoiLoc})}"></div>

            <p class="small text-secondary mt-3 mb-0">
                <i class="bi bi-info-circle me-1"></i>
                Dòng tổng tính trên <strong>toàn bộ</strong> kết quả lọc, không phải trang đang xem.
                Cột <strong>Còn nợ</strong> đọc thẳng từ hóa đơn — không cộng lại từ bảng thanh toán.
            </p>
        </div>
    </div>

</div>

</body>
</html>
