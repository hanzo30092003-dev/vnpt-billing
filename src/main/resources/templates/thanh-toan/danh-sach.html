<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Giao dịch thanh toán', ~{::noiDungTrang})}">
<body>

<div th:fragment="noiDungTrang">

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div th:replace="~{fragments/trang :: tieuDe(
                'bi-cash-stack', 'Giao dịch thanh toán',
                'Danh sách các lần khách đã trả tiền. In lại phiếu thu cho khách từ màn hình này.')}"></div>
        <div th:replace="~{fragments/trang :: nutExcel('/thanh-toan/xuat-excel?' + ${chuoiLoc})}"></div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form method="get" th:action="@{/thanh-toan}" th:object="${boLoc}" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small mb-1">Từ ngày</label>
                    <input type="date" class="form-control" th:field="*{tuNgay}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small mb-1">Đến ngày</label>
                    <input type="date" class="form-control" th:field="*{denNgay}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small mb-1">Hình thức</label>
                    <select class="form-select" th:field="*{hinhThuc}">
                        <option value="">Tất cả</option>
                        <option th:each="h : ${danhSachHinhThuc}" th:value="${h}" th:text="${h.nhan}"></option>
                    </select>
                </div>
                <div th:replace="~{fragments/trang :: nutLoc('/thanh-toan', 'col-md-3')}"></div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex align-items-center">
            <strong th:text="${ketQua.totalElements} + ' giao dịch'">0 giao dịch</strong>
            <span class="ms-auto">
                Tổng thu:
                <strong class="text-success"
                        th:text="${#numbers.formatDecimal(tongThu, 0, 'POINT', 0, 'COMMA')} + ' đ'"></strong>
            </span>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm bang-du-lieu mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Mã giao dịch</th>
                        <th>Thời điểm</th>
                        <th>Hóa đơn</th>
                        <th>Khách hàng</th>
                        <th>Số thuê bao</th>
                        <th class="text-end">Số tiền</th>
                        <th>Hình thức</th>
                        <th>Người thu</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${ketQua.isEmpty()}">
                        <td colspan="9">
                            <div th:replace="~{fragments/trang :: bangRong(
                                    'bi-cash-stack',
                                    'Chưa có lần thu tiền nào khớp bộ lọc đang đặt. Muốn ghi nhận khách vừa trả tiền thì mở hóa đơn của khách rồi bấm Ghi nhận thanh toán.',
                                    'Xem danh sách hóa đơn', @{/hoa-don})}"></div>
                        </td>
                    </tr>
                    <tr th:each="t : ${ketQua.content}">
                        <td th:text="${t.maGiaoDich}"></td>
                        <td th:text="${#temporals.format(t.ngayThanhToan, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/hoa-don/{id}(id=${t.hoaDon.id})}"
                               th:text="${t.hoaDon.maHoaDon}"></a>
                        </td>
                        <td th:text="${t.hoaDon.khachHang.tenKh}"></td>
                        <td th:text="${t.hoaDon.thueBao.soThueBao}"></td>
                        <td class="text-end fw-semibold text-success"
                            th:text="${#numbers.formatDecimal(t.soTien, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td th:text="${t.hinhThuc.nhan}"></td>
                        <td th:text="${t.nguoiThu != null} ? ${t.nguoiThu.hoTen} : '—'"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/thanh-toan/{id}/phieu-thu(id=${t.id})}">
                                <i class="bi bi-printer"></i> Phiếu thu
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/trang :: phanTrang(${ketQua}, '/thanh-toan', ${chuoiLoc})}"></div>

            <p class="small text-secondary mt-3 mb-0">
                <i class="bi bi-info-circle me-1"></i>
                Tổng thu tính trên <strong>toàn bộ</strong> kết quả lọc, không phải trang đang xem.
            </p>
        </div>
    </div>

</div>

</body>
</html>
