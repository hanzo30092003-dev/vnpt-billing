<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
    Đầu trang dùng chung: biểu tượng + tiêu đề + MỘT CÂU nói màn hình này để làm gì.

    Vì sao phải có câu đó: người dùng đích của phần mềm là nhân viên giao dịch quen
    Excel và Zalo, chưa từng dùng phần mềm nghiệp vụ. Một tiêu đề như "Đối soát cước"
    không nói được gì với họ. Câu mô tả viết cho người CHƯA BIẾT GÌ, dưới 25 từ,
    không dùng thuật ngữ.

    Vì sao là fragment chứ không chép ở từng trang: 30 màn hình chép cùng một khối
    markup thì lần sau muốn đổi cách trình bày phải sửa 30 chỗ, và chắc chắn sót.
    Chỉ có CHỮ là khác nhau giữa các trang — và chữ thì buộc phải khác.

    Cách dùng khi trang KHÔNG có nút bên phải tiêu đề:

        <div th:replace="~{fragments/trang :: tieuDe(
                 'bi-people', 'Quản lý khách hàng',
                 'Tìm và xem khách hàng đang có...')}"></div>

    Cách dùng khi trang CÓ nút bên phải — trang tự giữ khung d-flex của nó:

        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
            <div th:replace="~{fragments/trang :: tieuDe('bi-receipt', '...', '...')}"></div>
            <div class="d-flex gap-2 khong-in"> ...các nút... </div>
        </div>
*/-->
<div th:fragment="tieuDe(bieuTuong, tieuDe, moTa)" class="dau-trang">
    <h2 class="h4 mb-1">
        <i class="bi me-2" th:classappend="${bieuTuong}"></i><span th:text="${tieuDe}">Tiêu đề trang</span>
    </h2>
    <p class="mo-ta-trang mb-0" th:text="${moTa}">Màn hình này dùng để làm gì.</p>
</div>

<!--/*
    Chỉ RIÊNG dòng mô tả, cho những trang có tiêu đề ĐỘNG — tên khách hàng, mã
    hóa đơn, kèm huy hiệu trạng thái. Các trang đó phải tự dựng thẻ <h2> của
    mình nên không dùng được fragment tieuDe ở trên, nhưng vẫn dùng chung được
    dòng mô tả:

        <div class="dau-trang">
            <h2 class="h4 mb-1"> ...tiêu đề động của trang... </h2>
            <p th:replace="~{fragments/trang :: moTa('Câu giải thích...')}"></p>
        </div>
*/-->
<p th:fragment="moTa(chu)" class="mo-ta-trang mb-0" th:text="${chu}">Màn hình này dùng để làm gì.</p>

<!--/*
    HAI NÚT CUỐI KHỐI LỌC: "Lọc" và "Xoá bộ lọc".

    Trước đợt G4, sáu màn hình danh sách vẽ cặp nút này ba kiểu khác nhau:
        btn-outline-primary w-100  (khách hàng, thuê bao)
        btn-outline-primary btn-sm (hóa đơn, thanh toán, công nợ)
        btn-outline-primary        (CDR)
    và nút xoá thì hai kiểu — chỉ biểu tượng ở hai màn hình, có chữ ở bốn.
    Cùng một cặp việc, sáu màn hình, ba cỡ.

    Lớp cột truyền vào chứ không gói cứng: mỗi khối lọc có số ô khác nhau nên
    bề rộng cột nút phải khác. Chỉ CẶP NÚT là thống nhất.

    Nút xoá luôn có chữ, không để chỉ biểu tượng: dấu X một mình không nói
    được nó xoá bộ lọc hay xoá dữ liệu.
*/-->
<div th:fragment="nutLoc(duongDanGoc, lopCot)" th:class="${lopCot} + ' d-flex gap-2'">
    <button type="submit" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-search me-1"></i> Lọc
    </button>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{${duongDanGoc}}">
        <i class="bi bi-x-lg me-1"></i> Xoá bộ lọc
    </a>
</div>

<!--/*
    Nút xuất Excel. Trước đây bốn màn hình dùng cỡ mặc định còn khối báo cáo
    dùng btn-sm — cùng một hành động, hai cỡ.
*/-->
<a th:fragment="nutExcel(duongDan)" class="btn btn-outline-success btn-sm"
   th:href="@{${duongDan}}">
    <i class="bi bi-file-earmark-excel me-1"></i> Xuất Excel
</a>

<!--/*
    KHỐI PHÂN TRANG DÙNG CHUNG.

    Trước đợt G4, khối này được chép tay ở SÁU chỗ: cdr, hóa đơn, thanh toán,
    khách hàng, thuê bao và chi tiết gói cước. Sáu bản đã trôi ra hai nhánh —
    ba bản có flex-wrap, ba bản không — nên cùng một danh sách nhiều trang thì
    ở màn hình này dãy số xuống dòng, ở màn hình kia đẩy ngang.

    Ba tham số:
        trang     — đối tượng Page của Spring Data
        duongDan  — đường dẫn gốc, ví dụ '/hoa-don' hoặc '/goi-cuoc/' + id
        chuoiLoc  — chuỗi truy vấn của bộ lọc, truyền '' nếu màn hình không lọc

    Cửa sổ ±3 trang quanh trang hiện tại. Bản ở chi tiết gói cước trước đây
    liệt kê MỌI trang; gói cước nào có nhiều thuê bao thì dãy số dài bằng cả
    bảng. Nay nó theo cùng luật với năm màn hình kia.
*/-->
<nav th:fragment="phanTrang(trang, duongDan, chuoiLoc)"
     th:if="${trang.totalPages > 1}" class="mt-3">
    <ul class="pagination pagination-sm mb-0 justify-content-center flex-wrap">
        <li class="page-item" th:classappend="${trang.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{${duongDan} + '?trang=' + ${trang.number - 1} + ${chuoiLoc}}">Trước</a>
        </li>
        <li class="page-item"
            th:each="i : ${#numbers.sequence(
                trang.number - 3 < 0 ? 0 : trang.number - 3,
                trang.number + 3 >= trang.totalPages ? trang.totalPages - 1 : trang.number + 3)}"
            th:classappend="${i == trang.number} ? 'active'">
            <a class="page-link"
               th:href="@{${duongDan} + '?trang=' + ${i} + ${chuoiLoc}}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${trang.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{${duongDan} + '?trang=' + ${trang.number + 1} + ${chuoiLoc}}">Sau</a>
        </li>
    </ul>
</nav>

<!--/*
    Bảng rỗng. Thay cho một dòng "Không có dữ liệu" cụt lủn.

    Một bảng trống làm người mới dùng đứng lại: họ không biết là mình lọc hụt,
    hay hệ thống chưa có gì, hay mình làm sai bước nào. Nên khối này luôn nói
    HAI điều: vì sao đang trống, và bấm đi đâu tiếp.

    Nút để btn-outline-primary chứ KHÔNG phải btn-primary: trang vẫn còn nút
    chính của nó ở góc trên, hai nút xanh đặc cùng lúc là phá đúng cái luật
    "mỗi màn hình một nút nổi bật" vừa dựng ở việc 4.

    Truyền duongDan = null nếu chỗ đó thật sự không có việc gì để làm tiếp
    (ví dụ tab lịch sử của một thuê bao mới tạo) — khi đó chỉ hiện lời giải
    thích, không hiện nút.
*/-->
<div th:fragment="bangRong(bieuTuong, loiNhan, nhanNut, duongDan)"
     class="text-center text-secondary py-4">
    <i class="bi d-block fs-2 mb-2 opacity-50" th:classappend="${bieuTuong}"></i>
    <p class="mb-2" th:text="${loiNhan}">Chưa có dữ liệu.</p>
    <a th:if="${duongDan != null}" class="btn btn-sm btn-outline-primary"
       th:href="${duongDan}" th:text="${nhanNut}">Việc cần làm</a>
</div>

</body>
</html>
