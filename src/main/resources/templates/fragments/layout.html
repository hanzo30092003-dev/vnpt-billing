<!DOCTYPE html>
<!--/*
    Layout dùng chung cho toàn hệ thống.
    Cách dùng ở trang con:
        <html th:replace="~{fragments/layout :: layout('Tiêu đề trang', ~{::noiDungTrang})}">
    Trong đó ~{::noiDungTrang} trỏ tới th:fragment="noiDungTrang" của trang con.
*/-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(tieuDe, noiDung)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${tieuDe} - Quản lý thuê bao &amp; tính cước|">Quản lý thuê bao &amp; tính cước</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="app-shell">

    <!--/* ================= SIDEBAR TRÁI ================= */-->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-broadcast-pin"></i>
            <span>VNPT Billing</span>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-item" href="#"><i class="bi bi-house-door"></i> Trang chủ</a>

            <div class="nav-group">Danh mục</div>
            <a class="nav-item" href="#"><i class="bi bi-people"></i> Khách hàng</a>
            <a class="nav-item" href="#"><i class="bi bi-sim"></i> Thuê bao</a>
            <a class="nav-item" href="#"><i class="bi bi-box-seam"></i> Gói cước</a>
            <a class="nav-item" href="#"><i class="bi bi-tags"></i> Bảng giá</a>

            <div class="nav-group">Nghiệp vụ</div>
            <a class="nav-item" href="#"><i class="bi bi-file-earmark-text"></i> CDR</a>
            <a class="nav-item" href="#"><i class="bi bi-calculator"></i> Tính cước</a>
            <a class="nav-item" href="#"><i class="bi bi-receipt"></i> Hóa đơn</a>
            <a class="nav-item" href="#"><i class="bi bi-cash-coin"></i> Thanh toán</a>

            <div class="nav-group">Hệ thống</div>
            <a class="nav-item" href="#"><i class="bi bi-bar-chart-line"></i> Báo cáo</a>
            <a class="nav-item" href="#"><i class="bi bi-gear"></i> Quản trị</a>
        </nav>
    </aside>

    <div class="app-main">

        <!--/* ================= HEADER ================= */-->
        <header class="topbar">
            <h1 class="topbar-title">HỆ THỐNG QUẢN LÝ THUÊ BAO &amp; TÍNH CƯỚC</h1>

            <!--/* Phase 0 chưa bật đăng nhập nên hiển thị người dùng mặc định */-->
            <div class="topbar-user">
                <i class="bi bi-person-circle"></i>
                <span>Khách</span>
            </div>
        </header>

        <!--/* ================= NỘI DUNG TRANG ================= */-->
        <main class="content">
            <div th:replace="${noiDung}">Nội dung của trang con sẽ được chèn vào đây.</div>
        </main>

        <footer class="app-footer">
            Đồ án Thực tập nghề nghiệp &mdash; dữ liệu mẫu phục vụ học tập
        </footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</body>
</html>
