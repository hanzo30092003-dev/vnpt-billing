<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Hóa đơn của kỳ', ~{::noiDungTrang})}">
<body>

<div th:fragment="noiDungTrang">

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div class="dau-trang">
            <h2 class="h4 mb-1">
                <i class="bi bi-receipt me-2"></i>Hóa đơn kỳ
                <span th:text="${ky.thang} + '/' + ${ky.nam}"></span>
            </h2>
            <p th:replace="~{fragments/trang :: moTa(
                    'Toàn bộ hóa đơn đã lập cho một tháng tính tiền.')}"></p>
        </div>
        <a th:href="@{/tinh-cuoc}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Về màn hình tính cước
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">
            Danh sách hóa đơn
            <span class="badge text-bg-secondary ms-1" th:text="${#lists.size(danhSachHoaDon)}">0</span>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover bang-du-lieu align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Mã hóa đơn</th>
                        <th>Thuê bao</th>
                        <th>Khách hàng</th>
                        <th class="text-end">Thuê bao tháng</th>
                        <th class="text-end">Thoại</th>
                        <th class="text-end">SMS</th>
                        <th class="text-end">Dữ liệu</th>
                        <th class="text-end">Tổng thanh toán</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(danhSachHoaDon)}">
                        <td colspan="9" class="text-center text-secondary py-4">
                            Kỳ này chưa có hóa đơn nào.
                        </td>
                    </tr>
                    <tr th:each="h : ${danhSachHoaDon}">
                        <td class="fw-semibold" th:text="${h.maHoaDon}"></td>
                        <td th:text="${h.thueBao.soThueBao}"></td>
                        <td class="small" th:text="${h.khachHang.tenKh}"></td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(h.cuocThueBao, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(h.cuocThoai, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(h.cuocSms, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td class="text-end"
                            th:classappend="${h.cuocData.signum() > 0} ? 'fw-semibold text-danger'"
                            th:text="${#numbers.formatDecimal(h.cuocData, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td class="text-end fw-semibold"
                            th:text="${#numbers.formatDecimal(h.tongThanhToan, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/tinh-cuoc/doi-soat/{tb}/{ky}(tb=${h.thueBao.id},ky=${ky.id})}">
                                <i class="bi bi-clipboard-check"></i> Đối soát
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <p class="small text-secondary mt-3 mb-0">
                <i class="bi bi-info-circle me-1"></i>
                Cột <strong>Dữ liệu</strong> được tô đậm khi khác 0 — đó là những thuê bao đã
                dùng quá ưu đãi data của gói.
            </p>
        </div>
    </div>

</div>

</body>
</html>
