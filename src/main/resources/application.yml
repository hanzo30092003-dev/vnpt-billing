server:
  port: 8080

spring:
  application:
    name: vnpt-billing

  # ---------------------------------------------------------------
  # Ket noi MySQL 8. Tham so createDatabaseIfNotExist=true giup tu
  # tao schema vnpt_billing neu chua ton tai.
  # ---------------------------------------------------------------
  datasource:
    # rewriteBatchedStatements=true: MySQL Connector/J gop nhieu cau INSERT trong
    # cung mot batch thanh MOT cau lenh nhieu VALUES. Khong co tham so nay thi
    # batchUpdate van gui tung cau INSERT rieng le, chi tiet kiem duoc mot phan
    # chi phi. Xem so lieu do duoc trong docs/toi-uu-hieu-nang.md
    url: "jdbc:mysql://localhost:3306/vnpt_billing?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&rewriteBatchedStatements=true"
    # Lay tu bien moi truong - KHONG ghi mat khau truc tiep vao ma nguon
    username: "${MYSQL_USER:root}"
    password: "${MYSQL_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Bang duoc tao bang script SQL thu cong, KHONG de Hibernate tu sinh
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # Khong khai bao dialect: Hibernate tu nhan dien MySQL qua driver.
        # Khai bao thua se sinh canh bao HHH90000025 khi khoi dong.
        format_sql: true

  # ---------------------------------------------------------------
  # Script khoi tao CSDL: schema.sql tao bang, data-mau.sql chen du lieu mau.
  #
  # mode=never la MAC DINH ke tu Phase 2. Ly do: schema.sql mo dau bang
  # DROP TABLE IF EXISTS, neu de mode=always thi moi lan khoi dong ung dung
  # se xoa sach CSDL, lam mat toan bo du lieu nguoi dung nhap qua giao dien.
  #
  # Khi can nap lai du lieu mau tu dau, chay voi profile "reset":
  #     .\mvnw spring-boot:run "-Dspring-boot.run.profiles=reset"
  # Profile do nam trong application-reset.yml va chi dat lai mode=always.
  # ---------------------------------------------------------------
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data-mau.sql
      encoding: UTF-8

  thymeleaf:
    cache: false
    encoding: UTF-8
