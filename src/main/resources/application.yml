server:
  port: 8080

  servlet:
    session:
      # Phien tu het han sau 30 phut khong thao tac. Truoc day khong khai gi nen
      # dung mac dinh 30 phut cua Tomcat - dung con so nhung la TINH CO, khong
      # phai mot quyet dinh. Khai ra de no thanh quyet dinh co the doi va co the
      # doc duoc.
      timeout: 30m
      cookie:
        # Chan JavaScript doc cookie phien: co lo hong XSS thi ke tan cong cung
        # khong lay duoc phien cua nguoi dang dang nhap.
        http-only: true
        # Chan gui cookie khi request den tu trang khac - mot lop chong CSRF nua
        # ben canh token cua Spring Security.
        same-site: strict
        # ⚠️ CO Y de false: he thong chay HTTP tren localhost cho do an. Dua ra
        # moi truong that phai bat len, neu khong cookie phien di tren mang dang ro.
        secure: false

  error:
    # Khong lo duong dan noi bo va thong diep ngoai le ra trang loi cho nguoi dung.
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: vnpt-billing

  # ---------------------------------------------------------------
  # Ket noi MySQL 8. Tham so createDatabaseIfNotExist=true giup tu
  # tao schema vnpt_billing neu chua ton tai.
  # ---------------------------------------------------------------
  datasource:
    # rewriteBatchedStatements=true: MySQL Connector/J gop nhieu cau INSERT trong
    # cung mot batch thanh MOT cau lenh nhieu VALUES. Khong co tham so nay thi
    # batchUpdate van gui tung cau INSERT rieng le, chi tiet kiem duoc mot phan
    # chi phi. Xem so lieu do duoc trong docs/toi-uu-hieu-nang.md
    url: "jdbc:mysql://localhost:3306/vnpt_billing?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&rewriteBatchedStatements=true"
    # Lay tu bien moi truong - KHONG ghi mat khau truc tiep vao ma nguon
    username: "${MYSQL_USER:root}"
    password: "${MYSQL_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Bang duoc tao bang script SQL thu cong, KHONG de Hibernate tu sinh
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # Khong khai bao dialect: Hibernate tu nhan dien MySQL qua driver.
        # Khai bao thua se sinh canh bao HHH90000025 khi khoi dong.
        format_sql: true

  # ---------------------------------------------------------------
  # FLYWAY - di tru cau truc CSDL  (viec V4 cua dot hoan thien)
  # ---------------------------------------------------------------
  # Truoc day cau truc bang do schema.sql lo, va file do mo dau bang
  # DROP TABLE. He qua: cach duy nhat de dua CSDL ve dung cau truc moi
  # la XOA SACH roi dung lai - "doi cau truc bang la mat sach du lieu".
  # Hai lan doi cot cua chinh dot nay (hoa_don.phien_ban, roi
  # nguoi_dung.so_lan_sai + khoa_den_luc) vi vay deu phai go ALTER TABLE
  # bang tay tren console, khong dau vet, khong ai biet CSDL cua minh da
  # co cot chua.
  #
  # Nay cau truc di theo cac file db/migration/V*.sql. Them cot = them mot
  # file, chay len la xong, du lieu giu nguyen. Bang flyway_schema_history
  # ghi lai file nao da chay luc nao.
  #
  # ⚠️ DU LIEU MAU KHONG NAM TRONG FLYWAY - co y. data-van-hanh.sql la ban
  # dump duoc SINH LAI moi khi trang thai van hanh doi; de no thanh file di
  # tru thi moi lan dump lai la doi checksum, va moi CSDL dang chay se tu
  # choi khoi dong voi "Migration checksum mismatch". Du lieu mau nap bang
  # duong rieng, chi trong profile "reset" - xem FlywayResetConfig.
  # ---------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cam "flyway clean" o cau hinh thuong. Clean la lenh XOA SACH SCHEMA;
    # chi profile reset moi mo khoa no (application-reset.yml).
    clean-disabled: true

  thymeleaf:
    cache: false
    encoding: UTF-8

# ---------------------------------------------------------------------
# THAM SO NGHIEP VU  (viec V5 cua dot hoan thien)
#
# Thue suat VAT la CHINH SACH NHA NUOC, khong phai quy tac cua phan mem
# nay - va no da doi that: Viet Nam ha VAT xuong 8% cac nam 2022-2024 roi
# tra ve 10%. Truoc day no la hang so trong ThamSoTinhCuoc, nghia la moi
# lan doi thue suat la mot lan sua ma, bien dich lai va trien khai lai.
#
# Dang ti le: 0.10 nghia la 10%. Khai sai (am, hoac go 10 thay vi 0.10)
# thi ung dung KHONG KHOI DONG DUOC kem thong bao noi ro - co y, vi mot
# thue suat sai lot toi luc lap hoa don thi no da kip sinh ra vai tram to
# hoa don sai.
#
# ⚠️ Doi thue suat KHONG tinh lai hoa don cu - hoa don la chung tu, khong
# phai mot phep tinh chay lai duoc. Xem javadoc ThamSoNghiepVu.
# ---------------------------------------------------------------------
billing:
  thue-suat-vat: 0.10

# ---------------------------------------------------------------------
# GHI LOG RA FILE - them o Phase 7 muc C1
#
# Khong co muc nay thi stacktrace chi nam trong console, ma dong console lai
# la mat sach. GlobalExceptionHandler sinh mot MA SU CO cho moi loi khong
# luong truoc va hien no len trang 500; ma do chi co ich khi con file log de
# tra nguoc lai.
#
# File nam trong logs/ (da co trong .gitignore qua quy tac *.log). Cat theo
# ngay va giu 30 ban de khong phinh vo han.
# ---------------------------------------------------------------------
logging:
  file:
    name: logs/vnpt-billing.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/vnpt-billing-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
  level:
    com.hanzo.billing: INFO
