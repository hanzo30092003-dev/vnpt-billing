server:
  port: 8080

spring:
  application:
    name: vnpt-billing

  # ---------------------------------------------------------------
  # Ket noi MySQL 8. Tham so createDatabaseIfNotExist=true giup tu
  # tao schema vnpt_billing neu chua ton tai.
  # ---------------------------------------------------------------
  datasource:
    # rewriteBatchedStatements=true: MySQL Connector/J gop nhieu cau INSERT trong
    # cung mot batch thanh MOT cau lenh nhieu VALUES. Khong co tham so nay thi
    # batchUpdate van gui tung cau INSERT rieng le, chi tiet kiem duoc mot phan
    # chi phi. Xem so lieu do duoc trong docs/toi-uu-hieu-nang.md
    url: "jdbc:mysql://localhost:3306/vnpt_billing?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&rewriteBatchedStatements=true"
    # Lay tu bien moi truong - KHONG ghi mat khau truc tiep vao ma nguon
    username: "${MYSQL_USER:root}"
    password: "${MYSQL_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Bang duoc tao bang script SQL thu cong, KHONG de Hibernate tu sinh
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # Khong khai bao dialect: Hibernate tu nhan dien MySQL qua driver.
        # Khai bao thua se sinh canh bao HHH90000025 khi khoi dong.
        format_sql: true

  # ---------------------------------------------------------------
  # Script khoi tao CSDL: schema.sql tao bang, data-mau.sql chen du lieu mau.
  #
  # mode=never la MAC DINH ke tu Phase 2. Ly do: schema.sql mo dau bang
  # DROP TABLE IF EXISTS, neu de mode=always thi moi lan khoi dong ung dung
  # se xoa sach CSDL, lam mat toan bo du lieu nguoi dung nhap qua giao dien.
  #
  # Khi can nap lai du lieu mau tu dau, chay voi profile "reset":
  #     .\mvnw spring-boot:run "-Dspring-boot.run.profiles=reset"
  # Profile do nam trong application-reset.yml va chi dat lai mode=always.
  # ---------------------------------------------------------------
  # Hai file du lieu, chay theo dung thu tu nay:
  #   data-mau.sql      du lieu GOC viet tay - nguoi dung, khach hang, goi cuoc,
  #                     bang gia, thue bao, ky cuoc, dong mo so so du
  #   data-van-hanh.sql KET QUA VAN HANH do may sinh - CDR da dinh gia, hoa don,
  #                     chi tiet, giam tru, tru cuoc tra truoc, thanh toan
  #
  # Tach lam hai chu khong gop: file thu nhat nguoi doc duoc va sua tay duoc,
  # file thu hai la ban dump 1,1 MB va SUA TAY LA SAI - phai dump lai tu CSDL.
  # Thu tu bat buoc: data-van-hanh.sql tham chieu khoa ngoai vao data-mau.sql.
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data-mau.sql,classpath:db/data-van-hanh.sql
      encoding: UTF-8

  thymeleaf:
    cache: false
    encoding: UTF-8

# ---------------------------------------------------------------------
# GHI LOG RA FILE - them o Phase 7 muc C1
#
# Khong co muc nay thi stacktrace chi nam trong console, ma dong console lai
# la mat sach. GlobalExceptionHandler sinh mot MA SU CO cho moi loi khong
# luong truoc va hien no len trang 500; ma do chi co ich khi con file log de
# tra nguoc lai.
#
# File nam trong logs/ (da co trong .gitignore qua quy tac *.log). Cat theo
# ngay va giu 30 ban de khong phinh vo han.
# ---------------------------------------------------------------------
logging:
  file:
    name: logs/vnpt-billing.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/vnpt-billing-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
  level:
    com.hanzo.billing: INFO
